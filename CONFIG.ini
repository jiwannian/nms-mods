; 方案 A：无限喷气 + 瞬间激光采集
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 原版参考值写在每行注释里。

[Flight]
; 核心喷气背包真实燃料属性：零耗能、高容量、高回充
CoreJetpackDrain=0
CoreJetpackTank=9999
CoreJetpackRefill=9999
; 全局喷气回充（原版 0.5 / 0.25）
JetpackFillRate=9999
JetpackFillRateMidair=9999
; 空间站、舰队、枢纽内的喷气回充倍率（原版 5/5/20）
JetpackFillRateSpaceStationMultiplier=9999
JetpackFillRateFleetMultiplier=9999
JetpackFillRateNexusMultiplier=9999
; 喷气最低燃料阈值，0 表示燃料再低也能点火（原版 0.5）
JetpackMinLevel=0
; 双击空格会触发原生火箭靴；归零其阈值与两种燃料消耗
RocketBootsJetpackMinLevel=0
RocketBootsBoostTankDrainSpeed=0
RocketBootsDriftTankDrainSpeed=0
; 水平飞行速度（原版约 5）
JetpackMaxSpeed=30
; 上升速度（原版约 30）
JetpackMaxUpSpeed=40
; 水平推力（原版约 31）
JetpackForce=48
; 上升推力，需要大约 20 以上才能悬停/上升（原版约 30）
JetpackUpForce=40
; 点空格瞬间的启动推力（原版约 60）
JetpackIgnitionForce=80
; 空中刹车（原版约 2.2）
JetpackBrake=4.4
; 水平移动喷气消耗系数，0 表示不消耗（原版约 2.5）
JetpackDrainHorizontalFactor=0
; 水下喷气（原版耗能 0.4 / 回充 1）
JetpackUnderwaterDrainRate=0
JetpackUnderwaterFillRate=9999
UnderwaterMaxJetpackSpeed=30
UnderwaterJetpackForce=40
; 空间/太空喷气耗能，0 表示不消耗（原版 0.3）
SpaceJetpackDrainRate=0
; 太空行走喷气
SpacewalkMaxSpeed=80
SpacewalkJetpackForce=40
SpacewalkJetpackUpForce=30
SpacewalkBrake=4

[Mining]
; 激光打矿物/植物/晶体的伤害倍率（原版 1，越大越接近瞬间碎）
LaserMiningDamageMultiplier=10000
; 激光挖地形/矿脉的速率（原版约 0.3）
LaserBeamMineRate=100
; 基础采矿激光伤害加成
LaserDamageBonus=999999
; 采矿速度，越小越快（高级采矿激光原版约 0.85）
LaserMiningSpeed=0.01
; 激光过热时间，越大越不容易过热
LaserHeatTime=9999
