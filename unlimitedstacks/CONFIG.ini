; 可堆叠物品无限堆叠
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 实际堆叠 = min(StackLimit, 各背包上限 × 物品 StackMultiplier)
; 引擎用有符号 int32。各背包上限会再乘 StackMultiplier（离子电池=20，个别产品=1000），
; 乘完必须 <= 2147483647，否则 UI 会显示成负数（例如 999999999×20 = -1474836500）。

[Stacks]
; 物质/产品硬顶，以及各背包物质/产品上限（原版硬顶 9999）
; 999999 对玩家等于无限，且 999999×1000 仍在 int32 内。
StackLimit=999999
; 保留弹窗背包的产品上限（原版 1），避免拾取弹窗异常
KeepUIPopup=true
