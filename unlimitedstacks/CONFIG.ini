; 可堆叠物质堆叠上限；产品格子保持原版。
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 实际堆叠 = min(硬顶, 各背包上限 × 物品 StackMultiplier)
;
; 99999999×20（离子电池）= 1999999980，仍在 int32 内，建造 UI 不会显示负数。
; 产品格子不能跟物质一起拉高：发射燃料 StackMultiplier=4，格子过大时
; 做 1 罐会拆成多格，充能只加 25%。

[Stacks]
; 物质硬顶和各背包物质上限（原版硬顶 9999）
SubstanceStackLimit=99999999
; 产品硬顶，给建造/配方 UI 做 min(数量, 硬顶×倍率)。99999999×20 不溢出。
ProductStackLimit=99999999
; 产品各背包格子保持原版（身上约 10×倍率），避免燃料/电池充能异常
KeepVanillaProducts=true
; 仅当 KeepVanillaProducts=false 时，把各背包产品格子也改成 ProductStackLimit
KeepUIPopup=true
