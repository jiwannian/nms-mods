; 可堆叠物质无限堆叠；产品保持原版。
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 实际堆叠 = min(StackLimit, 各背包上限 × 物品 StackMultiplier)
;
; 产品不能跟物质一起拉到 999999。发射燃料 StackMultiplier=4、ChargeValue=400，
; 推进器 ChargeAmount=200。原版 1 罐充满；产品上限过大时会拆成多格，
; 每罐只加 25%（1/StackMultiplier）。

[Stacks]
; 物质硬顶和各背包物质上限（原版硬顶 9999）
SubstanceStackLimit=999999
; 产品保持原版堆叠，避免充能/燃料制作异常
KeepVanillaProducts=true
; 仅当 KeepVanillaProducts=false 时生效
ProductStackLimit=999999
; 保留弹窗背包的产品上限（原版 1）
KeepUIPopup=true
