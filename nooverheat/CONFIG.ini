; 武器不过热（手持 / 载具 / 机甲 / 飞船）
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 若已装瞬间采集：其构建已合并不过热，本目录不会再覆盖科技表。

[Overheat]
; 激光/载具枪/飞船武器过热时间，越大越不容易过热（采矿激光原版约 8，飞船机炮约 7.5）
HeatTime=9999
; 过热警告出现时间（原版 0.7）。拉大后热条几乎不报警
HeatAlertTime=9999
; 过热后的伤害加成（原版 30）。0 = 即使过热也不加伤害
HeatDamageBoost=0
; 过热消退时间，越小冷却越快（原版 8）
OverheatDecay=0.01
; 过热宽限，越大越不容易触发过热（原版 1.05）
OverheatGenerosity=9999
; 脉冲枪/散射枪/烈焰枪热容量。中子炮有蓄力，不改它的 MaximumCharge
ProjectileHeatPool=9999
; 飞船机炮过热后冷却时间（原版 1，火箭 10）
ShipCoolTime=0.01
