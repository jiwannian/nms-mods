; 瞬间激光采集
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 原版参考值写在每行注释里。

[Mining]
; 激光打矿物/植物/晶体的伤害倍率（原版 1，越大越接近瞬间碎）
LaserMiningDamageMultiplier=10000
; 激光挖地形/矿脉的速率（原版约 0.3）
LaserBeamMineRate=100
; 基础采矿激光伤害加成（原版约 20）
LaserDamageBonus=999999
; 采矿速度，越小越快（基础激光原版 1，高级采矿激光原版约 0.85）
LaserMiningSpeed=0.01
; 激光过热时间，越大越不容易过热（原版约 8）
LaserHeatTime=9999
; 基础采矿激光采矿加成（LASER.Weapon_Laser_MiningBonus，原版 1）
LaserMiningBonus=10
; 高级采矿模组采矿加成（UT_MINER，原版约 1.5）
AdvancedLaserMiningBonus=20
