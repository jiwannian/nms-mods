; 瞬间激光采集
; 改完数字后运行 apply-config.ps1，再启动游戏。
; 原版参考值写在每行注释里。

[Mining]
; 激光打矿物/植物/晶体的伤害倍率（原版 1，越大越接近瞬间碎）
LaserMiningDamageMultiplier=10000
; 激光挖地形/矿脉的速率（原版约 0.3）
LaserBeamMineRate=100
; 基础采矿激光伤害加成（原版约 20）
LaserDamageBonus=999999
; 采矿速度，越小越快（基础激光原版 1，高级采矿激光原版约 0.85）
LaserMiningSpeed=0.01
; 激光过热时间，越大越不容易过热（原版约 8）
LaserHeatTime=9999
; 基础采矿激光采矿加成（LASER.Weapon_Laser_MiningBonus，原版 1）
LaserMiningBonus=10
; 高级采矿模组采矿加成（UT_MINER，原版约 1.5）
AdvancedLaserMiningBonus=20
; 载具/潜艇/机甲激光伤害。必须互不相同，热键开关靠这个在内存里辨认
VehicleLaserDamage=999701
SubLaserDamage=999702
MechLaserDamage=999703

[Toggle]
; 游戏内开关。先运行 Start-InstantMineToggle.cmd，NMS 窗口前台时按热键
Hotkey=F8
; 关闭瞬间采集时写回的原版值
LaserMiningDamageMultiplierOff=1
LaserBeamMineRateOff=0.3
LaserDamageOff=20
LaserMiningSpeedOff=1
StrongLaserMiningSpeedOff=0.85
LaserMiningBonusOff=1
AdvancedLaserMiningBonusOff=1.5
VehicleLaserDamageOff=80
SubLaserDamageOff=240
MechLaserDamageOff=100
